name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set — APK is signed with a temporary debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/vpn/release/app-vpn-release.apk dist/claude-vpn-guard-android.apk
          cp android/app/build/outputs/apk/full/release/app-full-release.apk dist/claude-vpn-guard-android-full.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          sudo apt-get install -y -q shellcheck nftables
          shellcheck -S warning linux/claude-vpn-guard linux/*.sh
          CLAUDE_VPN_GUARD_CONFIG=linux/config linux/claude-vpn-guard print-rules | sudo nft -c -f -

      - name: Package
        run: |
          VERSION=1.0.${{ github.run_number }} linux/build-deb.sh "$PWD/dist"
          tar -czf dist/claude-vpn-guard-linux.tar.gz -C linux \
            claude-vpn-guard claude-vpn-guard.service config install.sh uninstall.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build Arch package
        run: |
          useradd -m builder
          cp -r linux /home/builder/pkg
          sed -i "s/^pkgver=.*/pkgver=1.0.${{ github.run_number }}/" /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg
          su builder -c "cd ~/pkg && makepkg --nodeps --noconfirm"
          mkdir -p dist
          cp /home/builder/pkg/*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/

  release:
    needs: [android, linux, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Claude VPN Guard 1.0.${{ github.run_number }}" \
            --notes "Автоматическая сборка из ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Инструкция — в README."
